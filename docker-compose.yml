services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-reserve_me}
      MYSQL_USER: ${MYSQL_USER:-reserve_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-reserve_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-reserve_root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "reserve_user", "-preserve_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
