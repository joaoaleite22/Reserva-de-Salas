<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Acesse sua conta reserve.me." />
    <title>Entrar | reserve.me</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="login">
      <a class="brand" href="#" aria-label="reserve.me">
        reserve<span>.</span>me
      </a>

      <form id="login-form" novalidate>
        <div class="field">
          <input
            id="email"
            name="email"
            type="email"
            placeholder="E-mail"
            autocomplete="email"
            required
            aria-describedby="email-error"
          />
          <p class="error" id="email-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Senha"
            autocomplete="current-password"
            required
            aria-describedby="password-error"
          />
          <p class="error" id="password-error" aria-live="polite"></p>
        </div>

        <button class="submit-button" type="submit">Entrar</button>
        <a class="forgot-link" href="recuperar-senha.html">Esqueceu sua senha?</a>
      </form>

      <footer class="footer">
        <a href="termos-e-privacidade.html#termos">Termos de uso</a>
        <span aria-hidden="true">·</span>
        <a href="termos-e-privacidade.html#privacidade">Privacidade</a>
      </footer>
    </main>
  </body>
</html>
