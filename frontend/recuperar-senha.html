<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Recupere o acesso à sua conta reserve.me." />
    <title>Recuperar senha | reserve.me</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./recovery.js" defer></script>
  </head>
  <body>
    <main class="login">
      <a class="brand" href="./index.html" aria-label="reserve.me">
        reserve<span>.</span>me
      </a>

      <h1 class="page-title">Recuperar senha</h1>
      <p class="page-description">Informe seu e-mail para recuperar o acesso à sua conta.</p>

      <form id="recovery-form" novalidate>
        <div class="field">
          <input
            id="email"
            name="email"
            type="email"
            placeholder="E-mail"
            autocomplete="email"
            required
            aria-describedby="email-error"
          />
          <p class="error" id="email-error" aria-live="polite"></p>
        </div>

        <button class="submit-button" type="submit">Enviar instruções</button>
        <a class="forgot-link" href="./index.html">Voltar para o login</a>
      </form>

      <footer class="footer">
        <a href="./termos-e-privacidade.html#termos">Termos de uso</a>
        <span aria-hidden="true">·</span>
        <a href="./termos-e-privacidade.html#privacidade">Privacidade</a>
      </footer>
    </main>
  </body>
</html>
